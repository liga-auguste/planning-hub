{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Planning Hub{% endblock %}</title>
    <link href="{% static 'projects/css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --color-bg-primary: #fff;
            --color-bg-secondary: #f9f8f9;
            --color-bg-tertiary: #f4f2f4;
            --color-border-primary: #e9e8ea;
            --color-border-secondary: #e4e2e4;
            --color-text-primary: #282a30;
            --color-text-secondary: #3c4149;
            --color-text-tertiary: #6f6e77;
            --color-text-quaternary: #86848d;
            --color-accent: #7070ff;
            --color-accent-hover: #8989f0;
            --color-accent-tint: #f1f1ff;
            --color-overdue: #ef4444;
            --color-urgent: #f97316;
            --color-done: #22c55e;
            --color-overdue-tint: #fef2f2;
            --color-urgent-tint: #fff3e8;
            --shadow-low: 0px 1px 4px -1px #00000017;
            --shadow-medium: 0px 3px 12px #00000017;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--color-bg-secondary);
            color: var(--color-text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .wrapper {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 20px 0;
            flex: 1; display: flex; flex-direction: column;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 32px;
        }
        .wordmark {
            display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .wordmark img { height: 40px; width: auto; display: block; }
        .wordmark span {
            font-size: 11px; font-weight: 700; color: var(--color-text-primary);
            letter-spacing: 0.08em; text-transform: uppercase;
        }
        .wordmark:hover span { color: var(--color-text-secondary); }
        .page-footer {
            margin-top: auto; padding-top: 20px; padding-bottom: 32px;
            border-top: 1px solid var(--color-border-primary);
            display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
        }
        .page-footer a { font-size: 12px; color: var(--color-text-quaternary); text-decoration: none; }
        .page-footer a:hover { color: var(--color-text-secondary); }
        .page-footer .footer-copy { font-size: 12px; color: var(--color-text-quaternary); margin-left: auto; }
        .ps-track { display: flex; align-items: flex-start; width: 300px; }
        .ps-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .ps-step + .ps-step::before {
            content: ''; position: absolute; top: 4px;
            left: -50%; right: 50%; height: 2px; background: var(--color-border-primary);
        }
        .ps-step.done + .ps-step::before { background: var(--color-text-primary); }
        .ps-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-border-primary); margin-bottom: 6px; position: relative; z-index: 1; }
        .ps-step.done .ps-dot, .ps-step.active .ps-dot { background: var(--color-text-primary); }
        /* The landing page's halo, held still: a marker on the current step,
           not a loop that never resolves. */
        .ps-step.active .ps-dot { box-shadow: 0 0 0 3px rgba(26,26,26,0.10); }
        .ps-label { font-size: 10px; color: var(--color-text-quaternary); text-align: center; white-space: nowrap; }
        .ps-step.done .ps-label { color: var(--color-text-quaternary); }
        .ps-step.active .ps-label { color: var(--color-text-primary); font-weight: 600; }
        /* Only the planner fills topbar_right; on a phone the track takes
           its own row instead of squeezing beside the wordmark. */
        @media (max-width: 560px) {
            .top-bar { flex-wrap: wrap; row-gap: 14px; }
            .ps-track { width: 100%; max-width: 320px; }
        }
        #cookie-banner {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--color-text-primary);
            color: var(--color-border-secondary);
            font-size: 13px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            z-index: 9999;
        }
        #cookie-banner p { margin: 0; flex: 1; line-height: 1.5; }
        #cookie-banner a { color: var(--color-text-quaternary); text-underline-offset: 2px; }
        #cookie-banner button {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-primary.is-loading { opacity: 0.65; cursor: not-allowed; }
        .btn-primary .spinner {
            display: none; width: 10px; height: 10px;
            border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--color-bg-primary);
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-left: 8px; vertical-align: middle;
        }
        .btn-primary.is-loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="top-bar">
        <a class="wordmark" href="{% url 'index' %}">
            <img src="{% static 'projects/logo_schwarz.png' %}" alt="">
            <span>Planning Hub</span>
        </a>
        {% block topbar_right %}{% endblock %}
    </div>

    {% block content %}{% endblock %}

    {% include 'projects/_footer.html' %}
</div>

{% include 'projects/_cookie_banner.html' %}
<script>
(function () {
    const loadingButtons = [];
    document.querySelectorAll('form').forEach(function (form) {
        const btn = form.querySelector('button[type="submit"].btn-primary');
        if (!btn) return;
        loadingButtons.push({ btn: btn, originalText: btn.textContent });
        form.addEventListener('submit', function (e) {
            if (btn.classList.contains('is-loading')) {
                e.preventDefault();
                return;
            }
            const loadingText = btn.dataset.loadingText;
            if (loadingText) {
                btn.classList.add('is-loading');
                btn.textContent = loadingText;
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                btn.appendChild(spinner);
            }
        });
    });
    // Pages restored from the back/forward cache keep whatever DOM state
    // they had at unload time, so a button left mid-submit would otherwise
    // stay stuck in its loading state and swallow every future click.
    window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        loadingButtons.forEach(function (entry) {
            entry.btn.classList.remove('is-loading');
            entry.btn.textContent = entry.originalText;
        });
    });
})();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
