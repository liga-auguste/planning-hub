{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Klärungsfragen</title>
    <link href="{% static 'projects/css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body {
            background: #f7f7f8;
            color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
        }
        .top-bar {
            max-width: 720px; margin: 32px auto 0; padding-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .wordmark { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .wordmark img { height: 40px; width: auto; display: block; }
        .wordmark span { font-size: 11px; font-weight: 700; color: #1a1a1a; letter-spacing: 0.08em; text-transform: uppercase; }
        .wordmark:hover span { color: #555; }
        .ps-track { display: flex; align-items: flex-start; width: 300px; }
        .ps-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
        .ps-step + .ps-step::before {
            content: ''; position: absolute; top: 4px;
            left: -50%; right: 50%; height: 2px; background: #e0e0e0;
        }
        .ps-step.done + .ps-step::before { background: #1a1a1a; }
        .ps-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0e0e0; margin-bottom: 6px; position: relative; z-index: 1; }
        .ps-step.done .ps-dot, .ps-step.active .ps-dot { background: #1a1a1a; }
        .ps-label { font-size: 10px; color: #ccc; text-align: center; white-space: nowrap; }
        .ps-step.done .ps-label { color: #aaa; }
        .ps-step.active .ps-label { color: #1a1a1a; font-weight: 600; }
        .planner-card {
            max-width: 720px;
            margin: 0 auto 80px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 40px;
        }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        h2 { font-size: 14px; font-weight: 600; margin: 28px 0 12px; }
        .subtitle { color: #9b9b9b; margin-bottom: 24px; }
        .questions-box {
            background: #f7f7f8;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 8px;
            line-height: 1.7;
        }
        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        textarea:focus, input:focus { outline: none; border-color: #1a1a1a; }
        .field-label { font-size: 12px; color: #9b9b9b; margin-bottom: 4px; }
        .btn-primary {
            background: #1a1a1a;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            color: #fff;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-primary:hover { background: #333; }
        .back { color: #9b9b9b; font-size: 13px; text-decoration: none; display: block; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="/" class="wordmark"><img src="{% static 'projects/logo_schwarz.png' %}" alt=""><span>Planning Hub</span></a>
        <div class="ps-track">
            <div class="ps-step done"><div class="ps-dot"></div><span class="ps-label">Projekttyp</span></div>
            <div class="ps-step done"><div class="ps-dot"></div><span class="ps-label">Beschreiben</span></div>
            <div class="ps-step active"><div class="ps-dot"></div><span class="ps-label">Klärung</span></div>
            <div class="ps-step"><div class="ps-dot"></div><span class="ps-label">Review</span></div>
        </div>
    </div>
    <div class="planner-card">
        <a href="{% url 'planner_start' %}" class="back">← Zurück</a>
        <h1>Klärungsfragen</h1>
        <p class="subtitle">{{ description }}</p>

        <div class="questions-box">{{ questions|safe }}</div>

        <form method="post" action="{% url 'planner_review' %}">
            {% csrf_token %}
            <input type="hidden" name="description" value="{{ description }}">

            <h2>Antworten</h2>
            <textarea name="answers" rows="6"
                placeholder="Beantworte die Fragen oben..."></textarea>

            <button type="submit" class="btn-primary">Plan generieren →</button>
        </form>
    </div>
</body>
</html>
