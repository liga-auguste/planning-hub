{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planning Hub</title>
    <link href="{% static 'projects/css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container py-4">

        <h1 class="mb-1">Planning Hub</h1>
        <p class="text-muted mb-4">{{ today }}</p>

        <div class="card mb-5">
            <div class="card-body">
                <h5 class="card-title">KI-Wochenübersicht</h5>
                <p class="card-text">{{ summary|safe }}</p>
            </div>
        </div>

        {% for project in projects %}
        <div class="mb-4">
            <h2 class="h5">{{ project.name }} <span class="text-muted fw-normal">— {{ project.event_date }}</span></h2>
            <ul class="list-group">
                {% for task in project.tasks.all %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span {% if task.done %}class="text-decoration-line-through text-muted"{% endif %}>
                        {{ task.name }}
                    </span>
                    <small class="text-muted">{{ task.due_date }}</small>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}

    </div>

    <script src="{% static 'projects/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
