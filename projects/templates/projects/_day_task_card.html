<div class="day-task-card {{ task.urgency }}{% if task.done %} done{% endif %}{% if viewing_demo_data %} no-drag{% endif %}" data-task-id="{{ task.id }}"
     {% if task.project_name %}title="{{ task.project_name }} · {{ task.due|date:'d.m.' }}"{% endif %}>
    {% include "projects/_task_dot.html" %}
    <span class="day-task-name {% if task.done %}done{% endif %}">{{ task.name }}</span>
</div>
