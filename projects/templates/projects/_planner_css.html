    /* Shared planner-step CSS, included by planner_start.html,
       planner_questions.html and planner_review.html inside base_public.html's
       single <style> element. Deliberately not hoisted into base_public.html:
       impressum.html and datenschutz.html carry their own .back flavour at
       equal specificity, and base CSS is declared before extra_css, so a
       hoisted rule would silently land under theirs. Maps 1:1 onto a future
       planner stylesheet once the inline CSS moves out (#32). */
    .planner-card { background: var(--color-bg-primary); border: 1px solid var(--color-border-primary); border-radius: 12px; padding: 40px; }
    /* The landing page's headline treatment at working-surface size: same
       weight, tracking and tight leading, not the 42px poster cut. */
    h1 { font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; margin-bottom: 8px; }
    .subtitle { color: var(--color-text-tertiary); line-height: 1.65; margin-bottom: 28px; }
    .back { color: var(--color-text-quaternary); font-size: 13px; text-decoration: none; display: block; margin-bottom: 24px; }
    .back:hover { color: var(--color-text-primary); }
    .error-notice { background: var(--color-overdue-tint); color: var(--color-overdue); border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
    /* Bootstrap's .btn reads these; margin has no variable, so each step
       keeps its own margin-top rule. */
    .btn-primary {
        --bs-btn-color: var(--color-solid-text);
        --bs-btn-bg: var(--color-solid-bg);
        --bs-btn-border-color: var(--color-solid-bg);
        /* Hover/active feedback is opacity (below), not a second colour: in
           dark mode --color-solid-bg is already the same value
           --color-text-secondary would give, so that swap alone wouldn't be
           visible there the way it is in light mode. */
        --bs-btn-hover-color: var(--color-solid-text);
        --bs-btn-hover-bg: var(--color-solid-bg);
        --bs-btn-hover-border-color: var(--color-solid-bg);
        --bs-btn-active-color: var(--color-solid-text);
        --bs-btn-active-bg: var(--color-solid-bg);
        --bs-btn-active-border-color: var(--color-solid-bg);
        /* Bootstrap's .btn-primary would paint a disabled button #0d6efd. The
           loading state is a class (.is-loading), not the disabled attribute,
           so nothing reaches these today — they close the set so that a later
           switch to `disabled` can't turn the button blue. */
        --bs-btn-disabled-color: var(--color-solid-text);
        --bs-btn-disabled-bg: var(--color-solid-bg);
        --bs-btn-disabled-border-color: var(--color-solid-bg);
        /* Bootstrap builds its focus-ring rgba() from this triple, so it has
           to stay a literal RGB decomposition of --color-solid-bg's light
           value (#282a30) rather than a var() — rgba() can't take a custom
           property that is itself a hex color. */
        --bs-btn-focus-shadow-rgb: 40, 42, 48;
        /* The hand-rolled button had `border: none`; .btn would otherwise add
           1px and grow the box by 2px in each direction. */
        --bs-btn-border-width: 0;
        /* The landing page's pill: 99px radius, 12px/22px padding at weight
           600. 11px here plus Bootstrap's line-height of 1.5 on a 14px label
           computes to the same 43px box as the hand-rolled .action pill. */
        --bs-btn-border-radius: 99px;
        --bs-btn-padding-x: 22px;
        --bs-btn-padding-y: 11px;
        --bs-btn-font-size: 14px;
        --bs-btn-font-weight: 600;
    }
    .btn-primary:hover, .btn-primary:active { opacity: 0.85; }
    @media (max-width: 768px) {
        h1 { font-size: 24px; }
        .planner-card { padding: 28px; }
    }
    @media (max-width: 560px) {
        h1 { font-size: 22px; }
        .planner-card { padding: 20px; }
    }
