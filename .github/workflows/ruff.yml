name: Ruff

on:
  push:
    branches: [main]   # branches with a PR open are covered below; both triggers would run every commit twice
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # the run takes a few seconds; the six-hour default would burn the quota on a hung job
    steps:
      - uses: actions/checkout@v6
      # Version pinned, and kept in step with requirements-dev.txt: an unpinned
      # linter means a new ruff release can fail a pull request that changed
      # nothing. Upgrading is then its own commit, with its own diff to review.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
          args: "format --check"
