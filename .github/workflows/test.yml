name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python manage.py test projects --noinput
        env:
          DEMO_MODE: "true"   # SQLite instead of Postgres, see settings.py:80
