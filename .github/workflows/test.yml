name: Test

on:
  push:
    branches: [main]
    # The badge step at the end of this file pushes to main, so without this a
    # run would trigger the next run that rewrites the same file. '[skip ci]' in
    # that commit message already prevents it; this is the second belt, and it
    # is the one that still holds if the badge is ever edited by hand.
    paths-ignore:
      - "coverage.svg"
  pull_request:

jobs:
  test:
    name: test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only for the badge commit at the end; the default token is read-only
    timeout-minutes: 10   # the run takes ~25s; the six-hour default would burn the quota on a hung job
    strategy:
      fail-fast: false   # the point is knowing which backend broke, so one leg must not cancel the other
      matrix:
        include:
          # Each leg mirrors a configuration that actually ships, so neither is
          # wasted work: the public demo runs SQLite, production runs Postgres.
          - backend: sqlite
            demo_mode: "true"
          - backend: postgres
            demo_mode: "false"
    # Services are job-level, so this container also starts on the SQLite leg,
    # which never connects to it. That costs a few seconds; the alternative is
    # duplicating all five steps into a second job to save them.
    services:
      postgres:
        image: postgres:16   # matches docker-compose.yml
        env:
          POSTGRES_PASSWORD: postgres
          # Create the database DB_NAME points at (settings.py:91 default).
          # Tests only need the maintenance DB to create test_planning_hub,
          # but any step touching the *default* database — a future migrate
          # or check --database — would otherwise fail on a missing
          # planning_hub in a workflow whose tests just passed (#65).
          POSTGRES_DB: planning_hub
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432   # the job runs on the runner, not in a container, so the service is reached at localhost
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile
          cache: "pip"
      # requirements-dev.txt is installed for coverage, which the badge step
      # reads. It drags ruff along, which this job never calls — worth a few
      # seconds to keep the coverage pin in one place instead of naming a
      # version here that would drift from the file.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The count is checked, not just the exit code (#201): the tests live in
      # a package now, and a package that stops being discovered — a missing
      # __init__.py, a rename that shadows it — reports "Ran 0 tests ... OK"
      # and passes. `tee` keeps the output in the log while the grep reads it.
      - run: |
          set -o pipefail   # without it the pipeline reports tee's status and a failing run passes
          coverage run manage.py test projects --noinput 2>&1 | tee test-output.txt
          grep -qE '^Ran [1-9][0-9]* tests' test-output.txt \
            || { echo '::error::the run collected no tests'; exit 1; }
        env:
          DEMO_MODE: ${{ matrix.demo_mode }}   # "true" selects the SQLite branch, see settings.py:80
          # Ignored on the SQLite leg. DB_NAME, DB_HOST and DB_PORT already
          # default correctly (settings.py:91-95); DB_USER defaults to `liga`,
          # which does not exist on the runner. The postgres superuser also
          # brings the read access to the built-in `postgres` database that
          # Django needs in order to create test_planning_hub.
          DB_USER: postgres
          DB_PASSWORD: postgres
          # settings.py fails closed if this is unset (no insecure fallback
          # is worth having); the value itself is throwaway, scoped to this
          # job's process only.
          SECRET_KEY: ci-test-key

      # The badge is a single file in the repo, so exactly one leg may write it:
      # both legs pushing to main would race, and the loser would fail a job
      # whose tests passed. Postgres is the leg that mirrors production. Pull
      # requests are excluded because they cannot push to main — and a number
      # that describes main should not move before the merge does.
      - name: Update the coverage badge
        if: matrix.backend == 'postgres' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'BADGE'
          import subprocess, sys

          # sys.executable, not "python3": coverage is installed in the
          # interpreter running this script, and that is the one that must read
          # the data file. It also lets the script be run locally to check it.
          report = subprocess.run(
              [sys.executable, "-m", "coverage", "report"],
              capture_output=True, text=True, check=True,
          ).stdout

          # Read the TOTAL row by name. Taking the last line of the table would
          # break the moment coverage appends a warning after it.
          total = next(
              line.split()[-1] for line in report.splitlines() if line.startswith("TOTAL")
          )
          pct = int(total.rstrip("%"))

          if pct >= 90:
              color = "#4c1"
          elif pct >= 75:
              color = "#97ca00"
          elif pct >= 60:
              color = "#dfb317"
          else:
              color = "#e05d44"

          # The value box follows the text width so that "100%" cannot outgrow it.
          label_w = 63
          value_w = 7 * len(total) + 10
          total_w = label_w + value_w

          svg = f"""<svg xmlns="http://www.w3.org/2000/svg" width="{total_w}" height="20">
            <rect rx="3" width="{total_w}" height="20" fill="#555"/>
            <rect rx="3" x="{label_w}" width="{value_w}" height="20" fill="{color}"/>
            <rect x="{label_w}" width="4" height="20" fill="{color}"/>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="{label_w // 2}" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="{label_w // 2}" y="14">coverage</text>
              <text x="{label_w + value_w // 2}" y="15" fill="#010101" fill-opacity=".3">{total}</text>
              <text x="{label_w + value_w // 2}" y="14">{total}</text>
            </g>
          </svg>"""

          with open("coverage.svg", "w") as f:
              f.write(svg)
          print(f"Coverage badge: {total}")
          BADGE

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          # An unchanged badge is the common case — the percentage held — and no
          # reason to write a commit. '[skip ci]' keeps the push that does happen
          # from starting both workflows over a file neither of them reads.
          git diff --staged --quiet && exit 0
          git commit -m "Update the coverage badge [skip ci]"
          # A commit that landed on main while the tests ran must not fail this
          # job; rebasing onto it is safe, since this step only ever touches a
          # file no human edits.
          git pull --rebase origin main
          git push
