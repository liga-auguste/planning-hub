# Tool configuration (#46). The project ships no packaging metadata — this file
# exists so the dev tools have a config, and holds nothing else.

[tool.ruff]
target-version = "py312"  # matches the Dockerfile and the CI job

[tool.ruff.lint]
# Ruff's default rule set, minus two families that do not fit this project.
# Every entry here is a decision, not a way to make the check quiet: a rule
# nobody can justify is worse than no rule, because it teaches you to ignore red.
ignore = [
    # date.today() reported as timezone-naive. Resolved by #14/#85:
    # production call sites now use timezone.localdate(), which respects
    # settings.TIME_ZONE. The remaining findings are test fixtures building
    # calendar-relative dates, where timezone awareness buys nothing.
    # 146 findings, all in the projects/tests/ package.
    "DTZ011",
    # Mutable class attributes without a ClassVar annotation. Normal in Django
    # (Meta.ordering) and in module-level constants like MONTHS_DE; the
    # annotations would be noise. 31 findings.
    "RUF012",
]

# Coverage configuration. Everything lives here so that a plain `coverage report`
# is already the honest number *and* the gate — a measurement you have to
# remember a flag for is one you will eventually read wrong, and a threshold you
# have to remember a flag for is one that eventually stops holding.
[tool.coverage.run]
# Branches as well as statements (#272). A line report says which lines ran; it
# never says whether both sides of a conditional were taken. For a codebase
# whose decisions are branches — `if sim_date`, `if not viewing_demo_data`, the
# demo/production fork in every write view — that is the more interesting half.
# It does not move the badge: 93.10% statements alone, 92.52% combined, both
# 93% rounded.
branch = true
# Naming the packages, rather than letting coverage record whatever happened to
# be imported, is what makes a file no test touches show up at 0% instead of not
# showing up at all.
source = ["projects", "planning_hub"]
omit = [
    # Test code executes in full by definition. Measured before this config
    # existed, it was 5,505 of 7,218 statements and lifted the total from 97%
    # to 99% — it buries the number the measurement is for.
    "*/tests/*",
    # Generated by makemigrations and replayed in full whenever the test
    # database is built, so they report ~100% for work nobody wrote. A
    # migration is reviewed when it is written; coverage is not what tells
    # you it is correct.
    "*/migrations/*",
    # Entry points. gunicorn imports wsgi.py in production, asgi.py is unused,
    # and no test will ever import either — they would sit at a permanent 0%
    # that cannot go green, which is the kind of red you learn to skip past.
    # manage.py needs no entry: it is outside both source packages already.
    "*/wsgi.py",
    "*/asgi.py",
]

[tool.coverage.report]
# The gate (#272). Until this existed, coverage measured and nothing ever
# stopped: a pull request could take the total from 93% to 80% and go green,
# with the badge simply reporting the lower number afterwards.
#
# 90, not 92, deliberately. This is a floor against a real regression, not a
# ratchet that has to be nudged on every pull request — a gate you raise
# routinely is one you end up raising without reading. Moving it is a deliberate
# commit, the same stance requirements-dev.txt takes about the ruff pin.
fail_under = 90
# Not decoration: fail_under is compared against the percentage *as displayed at
# this precision*, so the default of 0 would make the threshold fuzzy by up to
# half a point in the permissive direction. Verified against the real data file
# at 92.52%:
#
#   coverage report --fail-under=93                 -> exit 0   (displays as 93)
#   coverage report --fail-under=93 --precision=2   -> exit 2
#
# With two digits the number means what it says. The badge keeps showing whole
# percent by asking for --precision=0 in its own report call, rather than
# rounding what it reads: coverage's display never reaches 100% below a true
# 100 and a round() here would — see the badge step in
# .github/workflows/test.yml.
precision = 2
