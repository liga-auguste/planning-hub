# Tool configuration (#46). The project ships no packaging metadata — this file
# exists so the dev tools have a config, and holds nothing else.

[tool.ruff]
target-version = "py312"  # matches the Dockerfile and the CI job

[tool.ruff.lint]
# Ruff's default rule set, minus two families that do not fit this project.
# Every entry here is a decision, not a way to make the check quiet: a rule
# nobody can justify is worse than no rule, because it teaches you to ignore red.
ignore = [
    # date.today() reported as timezone-naive. Resolved by #14/#85:
    # production call sites now use timezone.localdate(), which respects
    # settings.TIME_ZONE. The remaining findings are test fixtures building
    # calendar-relative dates, where timezone awareness buys nothing.
    # 146 findings, all in the projects/tests/ package.
    "DTZ011",
    # Mutable class attributes without a ClassVar annotation. Normal in Django
    # (Meta.ordering) and in module-level constants like MONTHS_DE; the
    # annotations would be noise. 31 findings.
    "RUF012",
]

# Coverage configuration. Both settings exist so that a plain `coverage report`
# is already the honest number — a measurement you have to remember a flag for
# is one you will eventually read wrong.
[tool.coverage.run]
# Naming the packages, rather than letting coverage record whatever happened to
# be imported, is what makes a file no test touches show up at 0% instead of not
# showing up at all.
source = ["projects", "planning_hub"]
omit = [
    # Test code executes in full by definition. Measured before this config
    # existed, it was 5,505 of 7,218 statements and lifted the total from 97%
    # to 99% — it buries the number the measurement is for.
    "*/tests/*",
    # Generated by makemigrations and replayed in full whenever the test
    # database is built, so they report ~100% for work nobody wrote. A
    # migration is reviewed when it is written; coverage is not what tells
    # you it is correct.
    "*/migrations/*",
    # Entry points. gunicorn imports wsgi.py in production, asgi.py is unused,
    # and no test will ever import either — they would sit at a permanent 0%
    # that cannot go green, which is the kind of red you learn to skip past.
    # manage.py needs no entry: it is outside both source packages already.
    "*/wsgi.py",
    "*/asgi.py",
]
