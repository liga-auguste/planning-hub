limit_req_zone $binary_remote_addr zone=demo:10m rate=30r/m;

server {
    listen 80;
    server_name planninghub.ligaauguste.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name planninghub.ligaauguste.de;

    ssl_certificate /etc/letsencrypt/live/planninghub.ligaauguste.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planninghub.ligaauguste.de/privkey.pem;

    location /static/ {
        alias /staticfiles/;
        # Safe since #74: filenames carry a content hash, so a changed file
        # is a new URL and this cache can never serve a stale version.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        limit_req zone=demo burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
