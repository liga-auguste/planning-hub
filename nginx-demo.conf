limit_req_zone $binary_remote_addr zone=demo:10m rate=30r/m;

server {
    listen 80;
    server_name planninghub.ligaauguste.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name planninghub.ligaauguste.de;

    ssl_certificate /etc/letsencrypt/live/planninghub.ligaauguste.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planninghub.ligaauguste.de/privkey.pem;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        limit_req zone=demo burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
