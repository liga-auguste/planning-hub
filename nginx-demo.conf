limit_req_zone $binary_remote_addr zone=demo:10m rate=10r/m;

server {
    listen 80;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        limit_req zone=demo burst=5 nodelay;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
