services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: planning_hub
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - static_files:/app/staticfiles

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
