# Docker's default json-file driver never rotates, so every service's logs
# are bounded here (#303). On production host/watch.sh copies them out
# before a recreate drops them.
x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: planning_hub
      POSTGRES_USER: liga
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - static_files:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/staticfiles:ro
      # nginx.conf's auth_basic_user_file points at this path, so without the
      # mount the password check has no file to read. Create .htpasswd before
      # the first start (see README) — Compose creates a missing bind-mount
      # source as an empty *directory*, which fails in a way that doesn't
      # name the real cause. Untracked on purpose: it holds a password hash.
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
