server {
    listen 80;

    location /static/ {
        alias /staticfiles/;
        # Safe since #74: filenames carry a content hash, so a changed file
        # is a new URL and this cache can never serve a stale version.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        auth_basic "Planning Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # #284: nginx's default is 60s, and gunicorn has no request budget to
        # match it — under gthread --timeout only kills a worker that stopped
        # communicating (entrypoint.sh), so this is the one limit a long
        # request actually meets. Trashing a project is one Notion call per
        # task, serially, because the API has no batch archive: a 100-task
        # project is ~100 round trips, and the 60s default would hand the
        # browser a failure for a write the server then finishes — the one
        # outcome worse than a slow one, since the page would claim the
        # project is still there. 120s matches gunicorn's number so the two
        # do not disagree about how long is too long.
        proxy_read_timeout 120s;
    }
}
