server {
    listen 80;

    location /static/ {
        alias /staticfiles/;
        # Safe since #74: filenames carry a content hash, so a changed file
        # is a new URL and this cache can never serve a stale version.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        auth_basic "Planning Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
