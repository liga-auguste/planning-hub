server {
    listen 80;

    location /static/ {
        alias /staticfiles/;
    }

    location / {
        auth_basic "Planning Hub";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
