services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
      - demo_db:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/staticfiles:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  static_files:
  demo_db:
